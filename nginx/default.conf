# 1. Chuyển hướng tự động từ HTTP (80) sang HTTPS (443)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# 2. Cấu hình HTTPS Reverse Proxy
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Đường dẫn chứng chỉ SSL/TLS
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Giao thức & Cache SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    # Bảo mật Server & Header (Hardening)
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # (Tùy chọn) Bổ sung CSP nếu giao diện web cho phép
    # add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;" always;

    # Giới hạn dung lượng request body (tránh DoS)
    client_max_body_size 1m;

    # Đường dẫn log (Phù hợp thu thập log Loki/Promtail)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Forward traffic tới Backend Container
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Header Proxy chuẩn
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Bổ sung hỗ trợ WebSocket (nếu ứng dụng cần)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout cấu hình hợp lý
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}